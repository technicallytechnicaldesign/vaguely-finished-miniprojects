<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sympathetic Network</title><style>body{margin:0;background:#eeeade;color:#152015;font:12px monospace}.w{max-width:1000px;margin:auto;padding:26px}h1{font:italic 70px Georgia;margin:8px 0;color:#355b37}.k{color:#355b37;letter-spacing:.16em;font-size:10px}.intro{font:25px Georgia;max-width:700px}.field{height:420px;background:#132215;position:relative;border:1px solid #1f301f;touch-action:none}.field canvas{width:100%;height:100%}.read{position:absolute;bottom:15px;left:16px;color:#e5efdb}.read b{color:#badb84}.controls{display:grid;grid-template-columns:1.3fr 1fr 1fr;border:1px solid #293328}.c{padding:15px;border-right:1px solid #293328}.c:last-child{border:0}label{display:block;color:#355b37;margin-bottom:8px;font-size:10px;letter-spacing:.12em}input{width:100%;accent-color:#355b37}button{font:inherit;padding:8px;border:1px solid #293328;background:transparent}button.on{background:#355b37;color:white}.hint{font:10px monospace;color:#526052}@media(max-width:700px){.w{padding:16px}.field{height:340px}.controls{grid-template-columns:1fr}.c{border-right:0;border-bottom:1px solid #293328}}</style><main class="w"><div class="k">GENLYD / EXPERIMENTS / STATEFUL SOUND ECOLOGY</div><h1>Sympathetic Network</h1><p class="intro">Tap one body. It wakes its neighbours softly, and they decide whether to answer each other.</p><section class="field" id="f"><canvas id="c"></canvas><div class="read" id="r"><b>sleeping</b> — power on, then disturb a body</div></section><section class="controls"><div class="c"><label>NETWORK</label><b id="s">unpowered</b><p><button id="p">power on</button> <button id="seed">seed disturbance</button></p><span class="hint">No samples: just a small society of tuned bodies with memory.</span></div><div class="c"><label>FERTILITY <span id="fv">54%</span></label><input id="fert" type="range" min="10" max="85" value="54"><label>MEMORY <span id="mv">46%</span></label><input id="mem" type="range" min="0" max="85" value="46"></div><div class="c"><label>SPACE <span id="sv">35%</span></label><input id="space" type="range" min="0" max="70" value="35"><label>OUTPUT <span id="ov">52%</span></label><input id="out" type="range" min="0" max="100" value="52"></div></section></main><script>(()=>{let $=s=>document.querySelector(s),C=$('#c'),x=C.getContext('2d'),N=[.18,.42,.68,.30,.60,.87].map((a,i)=>({x:a,y:[.38,.22,.35,.72,.75,.64][i],f:[147,220,294,175,262,330][i],e:0,t:0,c:0})),L=[[0,1,.7],[1,2,.58],[0,3,.55],[1,3,.43],[1,4,.7],[2,4,.57],[2,5,.46],[3,4,.64],[4,5,.72]],S={on:0,fert:.54,mem:.46};let ac,master,fb;function boot(){if(ac)return;ac=new AudioContext;master=ac.createGain();master.gain.value=.52;let d=ac.createDelay(1);d.delayTime.value=.39;fb=ac.createGain();fb.gain.value=.2;master.connect(ac.destination);master.connect(d);d.connect(fb);fb.connect(d);d.connect(master)}function tone(i,e){let n=N[i],t=ac.currentTime;[1,1.5,2].forEach((q,k)=>{let o=ac.createOscillator(),g=ac.createGain();o.type=k?'triangle':'sine';o.frequency.value=n.f*q;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(e*(k?.04:.075),t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+1.2+e);o.connect(g);g.connect(master);o.start(t);o.stop(t+2.4)})}function hit(i,e=.72){if(!S.on)return;let n=N[i];n.e=Math.min(1,n.e+e);n.t=1;if(n.c>0)return;n.c=.35;tone(i,.2+e*.7);setTimeout(()=>{L.forEach(l=>{if(l[0]!=i&&l[1]!=i)return;let j=l[0]==i?l[1]:l[0],z=e*l[2]*(.3+S.fert*.75);if(z>.1&&Math.random()<.22+S.mem*.65)setTimeout(()=>hit(j,z),120+Math.random()*650)});n.c=0},100)}$('#p').onclick=function(){boot();ac.resume();S.on=!S.on;this.classList.toggle('on',S.on);this.textContent=S.on?'power on':'power off';$('#s').textContent=S.on?'listening':'unpowered'};$('#seed').onclick=()=>hit(2,.64);$('#f').onpointerdown=e=>{let r=$('#f').getBoundingClientRect(),a=(e.clientX-r.left)/r.width,b=0,d=9;N.forEach((n,i)=>{let z=Math.hypot(a-n.x,(e.clientY-r.top)/r.height-n.y);if(z<d)d=z,b=i});hit(b)};[['fert','fv',v=>S.fert=v/100],['mem','mv',v=>S.mem=v/100],['space','sv',v=>fb&&(fb.gain.value=v/100*.58)],['out','ov',v=>master&&(master.gain.value=v/100)]].forEach(a=>$('#'+a[0]).oninput=e=>{$('#'+a[1]).textContent=e.target.value+'%';a[2](e.target.value)});function draw(){let d=devicePixelRatio,w=C.clientWidth*d,h=C.clientHeight*d;if(C.width!=w||C.height!=h)C.width=w,C.height=h;x.setTransform(d,0,0,d,0,0);w=C.clientWidth;h=C.clientHeight;x.fillStyle='#132215';x.fillRect(0,0,w,h);L.forEach(l=>{let a=N[l[0]],b=N[l[1]];x.beginPath();x.moveTo(a.x*w,a.y*h);x.lineTo(b.x*w,b.y*h);x.strokeStyle=`rgba(180,215,146,${.1+(a.t+b.t)*.3})`;x.stroke()});N.forEach((n,i)=>{n.e*=.977;n.t*=.987;n.c=Math.max(0,n.c-.03);let X=n.x*w,Y=n.y*h;x.beginPath();x.arc(X,Y,18+n.e*35,0,7);x.fillStyle=`rgba(183,216,130,${.15+n.e*.75})`;x.fill();x.fillStyle='#e1cf75';x.fillText((i+1)+' · '+n.f+'Hz',X-24,Y+50)});let a=N.filter(n=>n.e>.06).length;$('#r').innerHTML=a?`<b>${a} bodies awake</b> — traces change the next answer`:'<b>quiet field</b> — silence is allowed';requestAnimationFrame(draw)}draw()})()</script>
